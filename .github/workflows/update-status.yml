name: Update server status

on:
  schedule:
    - cron: '*/5 * * * *'   # каждые 5 минут
  workflow_dispatch: {}      # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write            # право коммитить status.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gamedig
        run: npm install gamedig --no-save

      - name: Query server
        run: node scripts/update-status.js

      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Auto: update server status [skip ci]"
          git push

