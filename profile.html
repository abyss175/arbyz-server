<script>
// ================== НАСТРОЙКИ ==================
const REPO = 'abyss175/arbyz-server';
const BRANCH = 'main';
const SITE_URL = 'https://abyss175.github.io/arbyz-server/profile.html';
const LS_KEY = 'zentrax_my_steamid';

// ================== ЧЕЙ ПРОФИЛЬ ПОКАЗАТЬ ==================
const params = new URLSearchParams(window.location.search);
let targetId = params.get('steamid');
const isMyProfile = !targetId;
if (!targetId) targetId = localStorage.getItem(LS_KEY);

// ================== ЗАГРУЗКА ДАННЫХ ==================
async function loadRanks() {
    const url = 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/ranks.json';
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('ranks.json не найден (HTTP ' + res.status + ')');
    return res.json();
}

// ================== НОРМАЛИЗАЦИЯ STEAMID ==================
function normalizeSteamId(v) {
    let s = String(v || '').trim();
    if (s.startsWith('STEAM_')) {
        const m = s.match(/STEAM_\d:([01]):(\d+)/);
        if (m) {
            const accountId = BigInt(m[2]) * 2n + BigInt(m[1]);
            return String(BigInt('76561197960265728') + accountId);
        }
    }
    return s;
}

// ================== ХЕЛПЕРЫ ==================
function formatPlaytime(m) {
    if (!m || m <= 0) return '0 м';
    const h = Math.floor(m / 60);
    return h > 0 ? h + ' ч ' + (m % 60) + ' м' : m + ' м';
}

function formatLastSeen(v) {
    if (!v) return '—';
    const d = new Date(v);
    return isNaN(d) ? String(v)
        : d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

/**
 * Считаем прогресс в процентах: от текущего ранга до следующего.
 * Ранги в data.ranks идут по возрастанию XP: [None(0), Silver I(50), ..., Global Elite(4500)]
 */
function progressPercent(data, me) {
    // Ищем индекс текущего звания
    const idx = data.ranks.findIndex(r => r.name === me.rank);
    if (idx < 0) return 0;

    // Если это последний ранг — прогресс 100%
    if (idx === data.ranks.length - 1) return 100;

    const currentXp = data.ranks[idx].xp;
    const nextXp = data.ranks[idx + 1].xp; // следующий порог

    // Игрок уже может иметь XP выше порога следующего ранга (если пороги изменились)
    if (me.xp >= nextXp) return 100;

    const range = nextXp - currentXp;
    if (range <= 0) return 0;

    const progress = (me.xp - currentXp) / range;
    return Math.min(100, Math.max(0, Math.round(progress * 100)));
}

/**
 * Сколько XP нужно до следующего ранга.
 * Если игрок уже на максимальном — возвращаем 0 и показываем «Максимальное звание достигнуто!»
 */
function xpToNext(data, me) {
    const idx = data.ranks.findIndex(r => r.name === me.rank);
    if (idx < 0) return 0;

    // Максимальный ранг
    if (idx === data.ranks.length - 1) return 0;

    const nextXp = data.ranks[idx + 1].xp;
    const needed = nextXp - me.xp;

    return needed > 0 ? needed : 0;
}

// ================== ОТРИСОВКА ==================
function render(data) {
    // 1. Топ игроков — рисуем всегда
    const tbody = document.getElementById('top-table');
    tbody.innerHTML = '';
    data.players.forEach(function(p, i) {
        const tr = document.createElement('tr');
        const pId = normalizeSteamId(p.steamId);
        if (targetId && pId === normalizeSteamId(targetId)) tr.classList.add('me');

        const avatarHtml = p.avatar
            ? '<img class="mini-avatar" src="' + p.avatar + '" alt="" onerror="this.style.display=\'none\'">'
            : '<div class="mini-icon">👤</div>';

        const steamLinkHtml = p.profileUrl
            ? ' <a class="steam-link" href="' + p.profileUrl + '" target="_blank" title="Профиль Steam">↗</a>'
            : '';

        tr.innerHTML =
            '<td>' + (i + 1) + '</td>' +
            '<td><span class="player-cell">' + avatarHtml +
                '<a href="' + SITE_URL + '?steamid=' + encodeURIComponent(pId) + '">' + p.name + '</a>' +
                steamLinkHtml +
            '</span></td>' +
            '<td>' + p.rank + '</td>' +
            '<td>' + p.xp + '</td>' +
            '<td>' + p.kd.toFixed(2) + '</td>' +
            '<td><span class="status-badge ' + (p.online ? 'status-online' : 'status-offline') + '">' +
                (p.online ? 'Онлайн' : 'Офлайн') + '</span></td>';

        tbody.appendChild(tr);
    });

    const upd = new Date(data.updated);
    if (!isNaN(upd)) {
        document.getElementById('updated-note').textContent =
            'Данные обновлены: ' + upd.toLocaleString('ru-RU');
    }

    // 2. Свой профиль: если ID не задан — форма
    if (!targetId) {
        document.getElementById('rank-name').textContent = 'Укажи свой SteamID';
        document.getElementById('rank-xp-current').textContent = '';
        document.getElementById('rank-xp-next').textContent = '';
        document.getElementById('id-setup').style.display = 'block';
        document.getElementById('save-steamid').onclick = function() {
            const val = normalizeSteamId(document.getElementById('steamid-input').value);
            if (val) { localStorage.setItem(LS_KEY, val); location.reload(); }
        };
        return;
    }

    // 3. Ищем игрока
    const me = data.players.find(function(p) {
        return normalizeSteamId(p.steamId) === normalizeSteamId(targetId);
    });
    if (!me) {
        document.getElementById('rank-name').textContent = 'Профиль не найден в статистике';
        document.getElementById('rank-xp-current').textContent = '';
        document.getElementById('rank-xp-next').textContent = 'Проверь SteamID — сыграй на сервере хотя бы один раунд.';
        if (isMyProfile) document.getElementById('id-setup').style.display = 'block';
        return;
    }

    // Левая карточка
    document.getElementById('profile-name').textContent = me.name;
    document.getElementById('profile-rank').textContent = me.rank;
    document.getElementById('stat-online').textContent = formatPlaytime(me.playtimeMinutes);
    document.getElementById('stat-kills').textContent = me.kills;
    document.getElementById('stat-deaths').textContent = me.deaths;
    document.getElementById('stat-kd').textContent = me.kd.toFixed(2);

    // Шапка и инфо
    document.title = 'ZENTRAX — ' + me.name;
    document.getElementById('header-name').textContent = me.name;
    document.getElementById('info-steamid').textContent = me.steamId;
    document.getElementById('info-lastseen').textContent = formatLastSeen(me.lastSeen);
    document.getElementById('info-rank').textContent = me.rank;

    // Аватарка
    const avatarImg = document.getElementById('profile-avatar');
    const fallback = document.getElementById('avatar-fallback');
    if (me.avatar) {
        avatarImg.style.display = 'block';
        avatarImg.src = me.avatar;
        fallback.style.display = 'none';
    } else {
        avatarImg.style.display = 'none';
        fallback.style.display = 'flex';
    }

    // Ссылка на Steam
    const steamLink = document.getElementById('info-steamlink');
    const placeholder = document.getElementById('steam-link-placeholder');
    if (me.profileUrl) {
        steamLink.href = me.profileUrl;
        steamLink.style.display = 'inline';
        placeholder.style.display = 'none';
    } else {
        steamLink.style.display = 'none';
        placeholder.style.display = 'inline';
    }

    // Прогресс
    document.getElementById('rank-name').textContent = me.rank;
    document.getElementById('rank-xp-current').textContent = me.xp + ' XP';

    const toNext = xpToNext(data, me);
    const rankBar = document.getElementById('rank-bar');
    rankBar.style.width = progressPercent(data, me) + '%';

    if (toNext === 0) {
        // Это либо максимальный ранг, либо XP уже выше порога следующего (редкий случай)
        document.getElementById('rank-xp-next').textContent = 'Максимальное звание достигнуто!';
        rankBar.style.background = 'var(--color-global, #ffd700)'; // опционально: цвет для Global Elite
    } else {
        document.getElementById('rank-xp-next').textContent = 'До следующего: ' + toNext + ' XP';
        // Сброс цвета, если был установлен для Global
        rankBar.style.removeProperty('background');
    }
}

loadRanks()
    .then(render)
    .catch(function(e) {
        console.error('Ошибка загрузки статистики:', e);
        document.getElementById('rank-name').textContent = 'Не удалось загрузить статистику: ' + e.message;
    });
</script>
