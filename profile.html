<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENTRAX — Профиль игрока</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #12151c;
        color: #e6e9ef;
        min-height: 100vh;
        padding: 24px;
    }
    .page { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .card {
        background: #1a1e29;
        border: 1px solid #262c3b;
        border-radius: 12px;
        padding: 20px;
    }
    /* Левая колонка: профиль */
    .profile { text-align: center; }
    .avatar {
        width: 120px; height: 120px;
        margin: 8px auto 16px;
        border-radius: 50%;
        border: 3px solid #3b82f6;
        background: #262c3b;
        display: flex; align-items: center; justify-content: center;
        font-size: 48px;
    }
    .profile-name { font-size: 22px; font-weight: 700; color: #fff; }
    .profile-role {
        display: inline-block; margin-top: 6px;
        font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
        color: #3b82f6;
    }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .stat-box {
        background: #20242f;
        border-radius: 10px;
        padding: 12px;
    }
    .stat-box .value { font-size: 20px; font-weight: 700; color: #fff; }
    .stat-box .label { font-size: 12px; color: #8b93a1; margin-top: 2px; }
    .stat-box .value.online { color: #4ade80; }
    .stat-box .value.kd { color: #fbbf24; }

    /* Правая колонка */
    .header-card { display: flex; align-items: center; gap: 14px; }
    .server-icon {
        width: 44px; height: 44px; border-radius: 10px;
        background: #26304a;
        display: flex; align-items: center; justify-content: center;
        font-size: 22px;
    }
    .header-card h1 { font-size: 22px; color: #fff; }
    .header-card p { color: #8b93a1; font-size: 14px; }

    h2.section-title { font-size: 16px; color: #fff; margin-bottom: 14px; }
    .info-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
    .info-row .key { color: #8b93a1; }
    .info-row .val { color: #e6e9ef; }
    .info-row .val.mono { font-family: Consolas, monospace; }

    .tabs { display: flex; gap: 24px; border-bottom: 1px solid #262c3b; margin: 8px 0 16px; }
    .tab { padding: 10px 0; font-size: 14px; color: #8b93a1; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 600; }

    /* Ранг */
    .rank-name { font-size: 26px; font-weight: 800; color: #fff; }
    .rank-xp { color: #fbbf24; font-weight: 600; margin-top: 4px; }
    .rank-progress {
        height: 8px; background: #2a2f3a;
        border-radius: 4px; overflow: hidden; margin: 12px 0 6px;
    }
    .rank-progress-bar {
        height: 100%; width: 0;
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        border-radius: 4px;
        transition: width 0.6s ease;
    }
    .rank-next { color: #8b93a1; font-size: 13px; }
    .rank-top { margin-top: 18px; }
    .rank-top table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .rank-top th { text-align: left; color: #8b93a1; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #262c3b; }
    .rank-top td { padding: 8px; border-bottom: 1px solid #20242f; }
    .rank-top tr.me td { background: #1c2436; }
    .status-badge { padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .status-online { background: rgba(74,222,128,.15); color: #4ade80; }
    .status-offline { background: rgba(139,147,161,.15); color: #8b93a1; }
    .updated-note { font-size: 12px; color: #8b93a1; margin-top: 12px; }

    @media (max-width: 820px) { .page { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page">

    <!-- Левая колонка -->
    <aside class="card profile">
        <div class="avatar">👤</div>
        <div class="profile-name" id="profile-name">—</div>
        <div class="profile-role" id="profile-rank-badge">—</div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="value online" id="stat-online">0 м</div>
                <div class="label">Онлайн</div>
            </div>
            <div class="stat-box">
                <div class="value" id="stat-kills">0</div>
                <div class="label">Убийств</div>
            </div>
            <div class="stat-box">
                <div class="value" id="stat-deaths">0</div>
                <div class="label">Смертей</div>
            </div>
            <div class="stat-box">
                <div class="value kd" id="stat-kd">0.00</div>
                <div class="label">K/D</div>
            </div>
        </div>
    </aside>

    <!-- Правая колонка -->
    <main>
        <div class="card header-card" style="margin-bottom: 20px;">
            <div class="server-icon">🛡️</div>
            <div>
                <h1 id="header-name">—</h1>
                <p>Добро пожаловать на ZENTRAX!</p>
            </div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <h2 class="section-title">📋 Информация о пользователе</h2>
            <div class="info-row">
                <span class="key">SteamID:</span>
                <span class="val mono" id="info-steamid">—</span>
            </div>
            <div class="info-row">
                <span class="key">Последний визит:</span>
                <span class="val" id="info-lastseen">—</span>
            </div>
            <div class="info-row">
                <span class="key">Звание:</span>
                <span class="val" id="info-rank">—</span>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab active">📊 Активность</div>
                <div class="tab">🏆 Достижения</div>
                <div class="tab">💬 Отзывы</div>
            </div>

            <!-- Активность: ранг и прогресс -->
            <div id="rank-info">
                <div class="rank-name" id="rank-name">Загрузка…</div>
                <div class="rank-xp" id="rank-xp"></div>
                <div class="rank-progress"><div class="rank-progress-bar" id="rank-bar"></div></div>
                <div class="rank-next" id="rank-next"></div>
            </div>

            <!-- Топ игроков -->
            <div class="rank-top">
                <h2 class="section-title">🏆 Топ игроков сервера</h2>
                <table>
                    <thead>
                        <tr><th>#</th><th>Игрок</th><th>Звание</th><th>XP</th><th>K/D</th><th>Статус</th></tr>
                    </thead>
                    <tbody id="top-table"></tbody>
                </table>
            </div>

            <div class="updated-note" id="updated-note"></div>
        </div>
    </main>
</div>

<script>
// ================== НАСТРОЙКИ ==================
const REPO = 'abyss175/arbyz-server'; // owner/repo — СВЕРЬ С СВОИМ РЕПОЗИТОРИЕМ
const BRANCH = 'main';
const MY_STEAM_ID = '76561199783123219'; // твой SteamID со скриншота

// ================== ЗАГРУЗКА ДАННЫХ ==================
async function loadRanks() {
    const url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/ranks.json`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('ranks.json не найден (HTTP ' + res.status + ')');
    return res.json();
}

// ================== ХЕЛПЕРЫ ==================
function formatPlaytime(minutes) {
    if (!minutes || minutes <= 0) return '0 м';
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return h > 0 ? `${h} ч ${m} м` : `${m} м`;
}

function formatLastSeen(value) {
    if (!value) return '—';
    const d = new Date(value);
    if (isNaN(d)) return String(value); // если в базе timestamp не в том формате — покажем как есть
    return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function progressPercent(data, me) {
    const idx = data.ranks.findIndex(r => r.name === me.rank);
    const cur = data.ranks[idx].xp;
    const next = idx > 0 ? data.ranks[idx - 1].xp : cur;
    if (next === cur) return 100;
    return Math.min(100, Math.round(((me.xp - cur) / (next - cur)) * 100));
}

function xpToNext(data, me) {
    const idx = data.ranks.findIndex(r => r.name === me.rank);
    if (idx <= 0) return 0; // максимальное звание — The Global Elite
    return data.ranks[idx - 1].xp - me.xp;
}

// ================== ОТРИСОВКА ==================
function render(data) {
    const me = data.players.find(p => p.steamId === MY_STEAM_ID);
    if (!me) {
        document.getElementById('rank-name').textContent = 'Профиль не найден в статистике';
        return;
    }

    // Левая карточка
    document.getElementById('profile-name').textContent = me.name;
    document.getElementById('profile-rank-badge').textContent = me.rank;
    document.getElementById('stat-online').textContent = formatPlaytime(me.playtimeMinutes);
    document.getElementById('stat-kills').textContent = me.kills;
    document.getElementById('stat-deaths').textContent = me.deaths;
    document.getElementById('stat-kd').textContent = me.kd.toFixed(2);

    // Шапка и инфо-блок
    document.getElementById('header-name').textContent = me.name;
    document.getElementById('info-steamid').textContent = me.steamId;
    document.getElementById('info-lastseen').textContent = formatLastSeen(me.lastSeen);
    document.getElementById('info-rank').textContent = me.rank;

    // Активность
    document.getElementById('rank-name').textContent = me.rank;
    document.getElementById('rank-xp').textContent = `${me.xp} XP`;
    document.getElementById('rank-bar').style.width = progressPercent(data, me) + '%';
    const toNext = xpToNext(data, me);
    document.getElementById('rank-next').textContent =
        toNext > 0 ? `До следующего звания: ${toNext} XP` : 'Максимальное звание достигнуто!';

    // Топ игроков
    const tbody = document.getElementById('top-table');
    tbody.innerHTML = '';
    data.players.forEach((p, i) => {
        const tr = document.createElement('tr');
        if (p.steamId === MY_STEAM_ID) tr.classList.add('me');
        tr.innerHTML = `
            <td>${i + 1}</td>
            <td>${p.name}</td>
            <td>${p.rank}</td>
            <td>${p.xp}</td>
            <td>${p.kd.toFixed(2)}</td>
            <td><span class="status-badge ${p.online ? 'status-online' : 'status-offline'}">
                ${p.online ? 'Онлайн' : 'Офлайн'}
            </span></td>
        `;
        tbody.appendChild(tr);
    });

    // Время обновления
    const upd = new Date(data.updated);
    document.getElementById('updated-note').textContent =
        'Данные обновлены: ' + upd.toLocaleString('ru-RU') + ' (синхронизация с сервером каждые ~10 минут)';
}

loadRanks()
    .then(render)
    .catch(e => {
        console.error('Ошибка загрузки статистики:', e);
        document.getElementById('rank-name').textContent = 'Не удалось загрузить статистику';
    });
</script>
</body>
</html>
