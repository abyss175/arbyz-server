<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль игрока — ZENTRAX CS2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <div class="logo">
            <div class="logo-icon">Z</div>
            <span class="logo-text">ZENTRAX</span>
        </div>
        <nav class="main-nav">
            <a href="index.html">Главная</a>
            <a href="rules.html">Правила</a>
            <a href="shop.html">Магазин</a>
            <a href="profile.html" class="active">Профиль</a>
        </nav>
    </div>
</header>

<main class="page-container">

    <div class="shop-header">
        <h1>Профиль игрока</h1>
        <p>Твоя статистика и привилегии на сервере ZENTRAX.</p>
    </div>

    <div class="card">
        <div style="display:flex; gap:20px; align-items:center;">
            <div style="width:80px; height:80px; background:#26304a; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:36px;">🎮</div>
            <div>
                <h3 style="margin:0; color:#fff;">Игрок #12345</h3>
                <p style="margin:4px 0 0; color:var(--muted);">Статус: VIP Gold</p>
                <p style="margin:6px 0 0;">Баланс: 149 ₽</p>
            </div>
        </div>
    </div>

    <section class="card">
        <h3 class="card-title">📊 Статистика</h3>
        <div class="stats-grid-wide">
            <div class="stat-box">
                <span class="stat-val">124</span>
                <span class="stat-label">Фраги</span>
            </div>
            <div class="stat-box">
                <span class="stat-val">89</span>
                <span class="stat-label">Смерти</span>
            </div>
            <div class="stat-box">
                <span class="stat-val">1.39</span>
                <span class="stat-label">K/D</span>
            </div>
            <div class="stat-box">
                <span class="stat-val">21</span>
                <span class="stat-label">Раундов сыграно</span>
            </div>
        </div>
    </section>

</main>

<footer class="site-footer">
    <p>&copy; 2026 ZENTRAX CS2 Server. Все права защищены.</p>
</footer>

</body>
</html>
